    <path d="M372 430 C372 520 470 520 560 520 H640"/>
  </g>
  <circle cx="372" cy="300" r="62" fill="url(#ac)"/>
  <circle cx="372" cy="300" r="26" fill="#0f131b"/>
  <rect x="640" y="470" width="120" height="100" rx="34" fill="url(#ac)"/>
  <rect x="640" y="630" width="120" height="100" rx="34" fill="#3a4f8f"/>
