<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="ac" gradientUnits="userSpaceOnUse" x1="300" y1="240" x2="780" y2="760">
      <stop offset="0" stop-color="#9db4ff"/>
      <stop offset="1" stop-color="#4f74f0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px tile centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- trunk session and its two linked branches -->
  <g fill="none" stroke="url(#ac)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 590 C372 680 470 680 560 680 H640" stroke="#3a4f8f"/>
